name: Build and upload artifacts


on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'master'
      - 'product'
      - 'prod'

      - 'develop'
      - 'dev'


env:
  LUA_VERSION: 5.4


jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Luac ${{ env.LUA_VERSION }}
        run: sudo apt install lua${{ env.LUA_VERSION }}

      - name: Build
        run: |
          mkdir -p out
          luac -o out/wallpaper.lua src/wallpaper.lua

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: out/
