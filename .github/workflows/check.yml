name: Build and test


on:
  workflow_dispatch:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches:
      - 'main'
      - 'master'
      - 'product'
      - 'prod'

      - 'develop'
      - 'dev'


env:
  LUA_VERSION: 5.4


jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Luac ${{ env.LUA_VERSION }}
        run: sudo apt install lua${{ env.LUA_VERSION }}

      - name: Build
        run: |
          mkdir -p out
          luac -o out/wallpaper.lua src/wallpaper.lua
